<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
  <title id="t3">Close-up of a signal relic</title>
  <desc id="d3">An original illustration of an ornate alien relic made of concentric rings and crystal shards emitting teal light against a dark backdrop.</desc>
  <rect width="800" height="500" fill="#0A0E14"/>
  <g transform="translate(400,250)">
    <circle r="150" fill="none" stroke="#1B2430" stroke-width="2"/>
    <circle r="110" fill="none" stroke="#2A3441" stroke-width="2"/>
    <circle r="70" fill="none" stroke="#4CE0B3" stroke-width="2" opacity="0.6"/>
    <circle r="30" fill="#4CE0B3" opacity="0.9"/>
    <circle r="30" fill="none" stroke="#EDF2F4" stroke-width="1.5"/>
    <g stroke="#FF6B4A" stroke-width="3" opacity="0.8">
      <line x1="0" y1="-150" x2="0" y2="-110"/>
      <line x1="0" y1="150" x2="0" y2="110"/>
      <line x1="-150" y1="0" x2="-110" y2="0"/>
      <line x1="150" y1="0" x2="110" y2="0"/>
    </g>
    <g fill="#EDF2F4" opacity="0.85">
      <polygon points="0,-70 10,-30 -10,-30"/>
      <polygon points="70,0 30,10 30,-10"/>
      <polygon points="0,70 10,30 -10,30"/>
      <polygon points="-70,0 -30,10 -30,-10"/>
    </g>
  </g>
</svg>
