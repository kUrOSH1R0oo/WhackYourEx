<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">Cracked horizon of the moon Kessa</title>
  <desc id="d1">An original illustration of a dark alien moonscape with jagged terrain, a glowing fissure, and two moons in the sky.</desc>
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="65%" stop-color="#121821"/>
      <stop offset="100%" stop-color="#1B2430"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CE0B3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4CE0B3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky1)"/>
  <circle cx="650" cy="90" r="34" fill="#EDF2F4" opacity="0.9"/>
